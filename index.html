<!doctype html>
<html lang="fr" translate="no">
  <head>
    <meta charset="UTF-8" />

    <!-- Favicon & icônes -->
    <link rel="icon" type="image/x-icon" href="/favicon.ico" />
    <link rel="icon" type="image/svg+xml" href="/icon.svg" />
    <link rel="apple-touch-icon" href="/apple-touch-icon-180x180.png" />

    <!-- Viewport -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <!-- PWA meta tags -->
    <meta name="theme-color" content="#0f172a" />
    <meta name="background-color" content="#f8fafc" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="SalesBoard" />
    <meta name="application-name" content="SalesBoard" />
    <meta name="description" content="Gestion commerciale — ventes, stocks, crédits, rapports" />

    <!-- Open Graph — fallback statique (remplacé dynamiquement par chaque boutique) -->
    <meta property="og:type"        content="website" />
    <meta property="og:site_name"   content="SalesBoard" />
    <meta property="og:title"       content="SalesBoard — Boutique en ligne" />
    <meta property="og:description" content="Découvrez notre boutique et commandez en ligne en quelques clics." />
    <meta property="og:locale"      content="fr_FR" />

    <!-- Twitter / X Cards — fallback statique -->
    <meta name="twitter:card"        content="summary" />
    <meta name="twitter:title"       content="SalesBoard — Boutique en ligne" />
    <meta name="twitter:description" content="Découvrez notre boutique et commandez en ligne en quelques clics." />

    <!-- Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=Manrope:wght@500;600;700;800&display=swap" rel="stylesheet">

    <title>SalesBoard</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
